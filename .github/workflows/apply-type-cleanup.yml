# risk executing those again.
name: Apply type cleanup

on:
  push:
    branches:
      - afk-workflow-cleanup-placeholder-never-push

permissions:
  contents: read

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: No-op
        run: echo "placeholder for workflow registration cleanup"
