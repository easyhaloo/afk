name: Architecture Refactor

on:
  push:
    branches:
      - refactor/architecture-aggressive
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Snapshot source tree
        run: |
          git status --short
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache node-gyp headers
        uses: actions/cache@v4
        with:
          path: ~/.cache/node-gyp
          key: node-gyp-${{ runner.os }}-node20-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies without root postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
      - name: Build node-pty native dependency
        run: pnpm rebuild node-pty --reporter=append-only
      - name: Build esbuild native dependency
        run: pnpm rebuild esbuild --reporter=append-only
      - name: Run project permission setup explicitly
        run: node scripts/fix-permissions.mjs
      - name: Architecture
        run: pnpm run architecture:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
