# Architecture verification for the aggressive refactor branch.
# CI trigger marker: validate current refactor head.
name: Architecture Refactor

on:
  push:
    branches:
      - refactor/architecture-aggressive
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot source tree
        uses: actions/upload-artifact@v4
        with:
          name: afk-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache node-gyp headers
        uses: actions/cache@v4
        with:
          path: ~/.cache/node-gyp
          key: node-gyp-${{ runner.os }}-node20-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies without root postinstall
        run: |
          set -euo pipefail
          timeout 12m pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Build node-pty native dependency
        run: |
          set -euo pipefail
          timeout 5m pnpm rebuild node-pty --reporter=append-only

      - name: Build esbuild native dependency
        run: |
          set -euo pipefail
          timeout 3m pnpm rebuild esbuild --reporter=append-only

      - name: Run project permission setup explicitly
        run: node scripts/fix-permissions.mjs

      - name: Architecture
        run: pnpm run architecture:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Prepare Puppeteer browser for tests
        run: |
          set -euo pipefail
          timeout 5m pnpm rebuild puppeteer --reporter=append-only
          executable="$(node -e "const p=require('puppeteer'); process.stdout.write(p.executablePath())")"
          test -x "$executable"
          echo "Puppeteer executable: $executable"

      - name: Test
        run: pnpm test
