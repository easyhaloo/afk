name: Architecture Refactor

on:
  push:
    branches:
      - refactor/architecture-aggressive
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot source tree
        uses: actions/upload-artifact@v4
        with:
          name: afk-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout 12m pnpm install --frozen-lockfile --reporter=append-only

      - name: Architecture
        run: pnpm run architecture:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
