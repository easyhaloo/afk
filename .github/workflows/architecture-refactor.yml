name: Architecture Refactor

on:
  push:
    branches:
      - refactor/architecture-aggressive
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run architecture:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
