name: CI Verification

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache node-gyp headers
        uses: actions/cache@v4
        with:
          path: ~/.cache/node-gyp
          key: node-gyp-${{ runner.os }}-node20-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-gyp-${{ runner.os }}-node20-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Build native dependencies
        run: |
          pnpm rebuild node-pty --reporter=append-only
          pnpm rebuild esbuild --reporter=append-only

      - name: Fix permissions
        run: node scripts/fix-permissions.mjs

      - name: Architecture guard
        run: pnpm run architecture:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Desktop Electron verification
        working-directory: desktop-client
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          pnpm typecheck
          pnpm test
          pnpm build

  desktop-e2e:
    name: Desktop E2E (Electron + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Playwright's Electron driver needs a display server. Linux runners
      # have no Xvfb by default — install it before launching Electron.
      - name: Install Xvfb and Electron Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Build native dependencies
        run: |
          pnpm rebuild node-pty --reporter=append-only
          pnpm rebuild esbuild --reporter=append-only

      - name: Fix permissions
        run: node scripts/fix-permissions.mjs

      - name: Install desktop-client dependencies
        working-directory: desktop-client
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Typecheck + build main
        working-directory: desktop-client
        run: |
          pnpm typecheck
          pnpm build:main

      # xvfb-run provides the display server Electron needs on Linux.
      - name: Run Playwright + Electron E2E
        working-directory: desktop-client
        env:
          CI: "true"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report
          path: desktop-client/playwright-report/
          retention-days: 7
