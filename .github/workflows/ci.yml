name: CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-link-check:
    name: Docs Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check doc links
        run: node scripts/check-doc-links.mjs

  cli:
    name: CLI (root package)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The root workspace declares packages/* AND desktop-client, so this
      # install also materialises the desktop-client dependency set. That set
      # is built and tested by the `verify` job against desktop-client's own
      # lockfile; this job only runs the root CLI's own checks.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Cache node-gyp headers
        uses: actions/cache@v4
        with:
          path: ~/.cache/node-gyp
          key: node-gyp-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-gyp-${{ runner.os }}-node22-

      # --ignore-scripts skipped every postinstall above; esbuild needs its
      # native binary for the build step. node-pty and puppeteer are only
      # used by the opt-in PTY E2E suite, so they are rebuilt in that step.
      - name: Build native dependencies
        run: pnpm rebuild esbuild --pending --reporter=append-only

      - name: Architecture check
        run: pnpm architecture:check --check-packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # node-pty 1.1.0 aborts the vitest worker when its ThreadSafeFunction
      # callback lands during Environment::CleanupHandles (unfixed upstream).
      # vitest.config.ts keeps the default suite off these files; this step is
      # advisory so an environment-specific crash cannot block a merge.
      - name: Build PTY E2E native dependencies
        run: pnpm rebuild node-pty puppeteer --pending --reporter=append-only

      - name: Test (PTY E2E, advisory)
        continue-on-error: true
        run: pnpm test:e2e:pty

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Architecture check
        run: pnpm architecture:check --check-packages

      - name: Cache node-gyp headers
        uses: actions/cache@v4
        with:
          path: ~/.cache/node-gyp
          key: node-gyp-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-gyp-${{ runner.os }}-node22-

      - name: Install dependencies
        working-directory: desktop-client
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Build native dependencies
        run: |
          pnpm --dir desktop-client rebuild electron node-pty esbuild --pending --reporter=append-only

      - name: Typecheck
        working-directory: desktop-client
        run: pnpm typecheck

      - name: Build
        working-directory: desktop-client
        run: pnpm build

      - name: Test
        working-directory: desktop-client
        run: pnpm test

  desktop-e2e:
    name: Desktop E2E (Electron + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Playwright's Electron driver needs a display server. Linux runners
      # have no Xvfb by default — install it before launching Electron.
      - name: Install Xvfb and Electron Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install desktop-client dependencies
        working-directory: desktop-client
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Build native dependencies
        run: |
          pnpm --dir desktop-client rebuild electron node-pty esbuild --pending --reporter=append-only

      - name: Typecheck + build main
        working-directory: desktop-client
        run: |
          pnpm typecheck
          pnpm build:main

      # xvfb-run provides the display server Electron needs on Linux.
      - name: Run Playwright + Electron E2E
        working-directory: desktop-client
        env:
          CI: "true"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report
          path: desktop-client/playwright-report/
          retention-days: 7
