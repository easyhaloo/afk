name: Dashboard PTY Debug
on:
  workflow_dispatch:
  push:
    branches:
      - refactor/architecture-aggressive
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
      - run: pnpm rebuild node-pty esbuild --reporter=append-only
      - run: pnpm run build
      - name: Capture production PTY bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from 'node-pty';
          import process from 'node:process';
          const child = spawn(process.execPath, ['dist/index.js'], {
            cols: 120,
            rows: 30,
            cwd: process.cwd(),
            env: { ...process.env, NO_TMUX: '1', FORCE_COLOR: '0' },
          });
          let chunks = [];
          let exited = false;
          child.onData(data => {
            chunks.push(Buffer.from(data));
            process.stdout.write(`[PTY DATA ${data.length}] ${JSON.stringify(data.slice(0, 240))}\n`);
          });
          child.onExit(e => {
            exited = true;
            console.log(`[PTY EXIT] exitCode=${e.exitCode} signal=${e.signal}`);
          });
          await new Promise(resolve => setTimeout(resolve, 1500));
          console.log(`[PTY STATE] child=${child.pid} exited=${exited} chunks=${chunks.length} bytes=${Buffer.concat(chunks).length}`);
          child.write('\x1b');
          await new Promise(resolve => setTimeout(resolve, 2500));
          console.log(`[PTY AFTER ESC] exited=${exited} chunks=${chunks.length} bytes=${Buffer.concat(chunks).length}`);
          if (!exited) child.kill();
          await new Promise(resolve => setTimeout(resolve, 200));
          console.log(`[PTY FINAL] bytes=${Buffer.concat(chunks).length}`);
          process.exit(Buffer.concat(chunks).length > 0 ? 0 : 2);
          EOF
      - name: Self-delete diagnostic workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/dashboard-debug.yml" \
            -f message="chore: remove temporary dashboard PTY diagnostic" \
            -f sha="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/dashboard-debug.yml?ref=${GITHUB_REF_NAME}" --jq .sha)" \
            -f branch="${GITHUB_REF_NAME}" || true
