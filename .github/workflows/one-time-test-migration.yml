name: One-time test migration
on:
  push:
    branches:
      - refactor/architecture-aggressive
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply test path migrations
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s#vi.mock('../io'#vi.mock('../../infrastructure/io/index'#" src/application/modules/qa-runner.test.ts
          sed -i "s#from './loop'#from '../../application/loop/loop-config'#" src/cli/commands/loop.test.ts
          sed -i "s#../src/lib/core/config/manager#../src/infrastructure/config/manager#g" tests/config.test.ts
          git diff --check
      - name: Commit and remove migration runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/modules/qa-runner.test.ts src/cli/commands/loop.test.ts tests/config.test.ts .github/workflows/one-time-test-migration.yml
          git rm .github/workflows/one-time-test-migration.yml
          git commit -m "test: migrate refactor paths and mocks"
          git push
