name: Patch Dashboard Diagnostics

on:
  push:
    branches:
      - refactor/architecture-aggressive

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PTY exit diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/dashboard-layout.test.ts')
          s = p.read_text()
          old = '''  private readonly exited: Promise<void>;\n\n  constructor(command: string, args: string[], cols: number) {'''
          new = '''  private readonly exited: Promise<void>;\n  private exitCode: number | undefined;\n  private exitSignal: number | undefined;\n\n  constructor(command: string, args: string[], cols: number) {'''
          s = s.replace(old, new)
          old = '''    this.exited = new Promise(resolve => this.proc.onExit(() => resolve()));'''
          new = '''    this.exited = new Promise(resolve => {\n      this.proc.onExit(({ exitCode, signal }) => {\n        this.exitCode = exitCode;\n        this.exitSignal = signal;\n        resolve();\n      });\n    });'''
          s = s.replace(old, new)
          old = '''      if (frame.includes(text)) return frame;\n      await delay(50);'''
          new = '''      if (frame.includes(text)) return frame;\n      if (this.exitCode !== undefined || this.exitSignal !== undefined) {\n        throw new Error(`Dashboard exited before ${JSON.stringify(text)} (code=${this.exitCode ?? 'null'}, signal=${this.exitSignal ?? 'null'}). Output: ${frame}`);\n      }\n      await delay(50);'''
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/dashboard-layout.test.ts
          git commit -m 'test: expose dashboard PTY exit diagnostics' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
