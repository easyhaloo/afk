name: Patch Dashboard PTY Test
on:
  push:
    branches:
      - refactor/architecture-aggressive
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production PTY entrypoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/dashboard-layout.test.ts')
          s = p.read_text()
          s = s.replace("const distPath = join(repositoryRoot, 'dist/index.js');", "const distPath = join(repositoryRoot, 'dist/cli/commands/board-entry.js');")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/dashboard-layout.test.ts
          git commit -m "test: exercise dashboard board entrypoint in PTY" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
