name: Release CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('apps/cli/package.json', 'utf8')).version)")"
          tag="cli-v${version}"

          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            [[ "${GITHUB_REF_NAME}" == cli-v* ]] || { echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2; exit 1; }
            requested="${GITHUB_REF_NAME#cli-v}"
            [[ "${requested}" == "${version}" ]] || { echo "Tag ${GITHUB_REF_NAME} does not match CLI version ${version}" >&2; exit 1; }
            tag="${GITHUB_REF_NAME}"
          fi

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            publish=false
          else
            publish=true
            # A tag created by an earlier successful package attempt may be reused
            # only when it points at this exact source commit. Never build from a
            # stale tag after a failed package job.
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              existing_tag_sha="$(git rev-parse "${tag}^{commit}")"
              if [[ "${existing_tag_sha}" != "${GITHUB_SHA}" ]]; then
                echo "::error::Tag ${tag} points to ${existing_tag_sha}, not ${GITHUB_SHA}. Increment apps/cli/package.json before retrying this release." >&2
                exit 1
              fi
            fi
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  package:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Verify target
        env:
          EXPECTED_TARGET: ${{ matrix.platform }}-${{ matrix.arch }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_TARGET) process.exit(1)'
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare build tool
        run: pnpm rebuild esbuild
      - name: Test installer
        run: pnpm exec vitest run tests/cli-install.test.ts tests/package-cli-validation.test.ts
      - name: Build, package and verify offline installation
        run: pnpm release:cli --version "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/cli/*
          if-no-files-found: error

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --verify-tag requires a local Git repository and tag refs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: release/cli
      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing_tag_sha="$(git rev-parse "${tag}^{commit}")"
            if [[ "${existing_tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Refusing to publish ${tag}: it points to ${existing_tag_sha}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "${tag}" -m "AFK CLI ${version}"
            git push origin "refs/tags/${tag}"
          fi

          gh release create "${tag}" release/cli/* --verify-tag --title "AFK CLI ${version}" --generate-notes --latest
