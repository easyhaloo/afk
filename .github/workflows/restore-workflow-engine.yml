name: one-time-restore-workflow-engine
on:
  push:
    branches: [refactor/architecture-aggressive]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - name: Apply hard migration fixes
        shell: bash
        run: |
          set -euo pipefail
          git show cada97afcab91739a1694c21e09551741fdb8a15:src/application/workflow-engine.ts > src/application/workflow-engine.ts
          python3 - <<'PY'
          from pathlib import Path
          repl = {
            "from './core/git'": "from '../infrastructure/git/index'",
            "from './core/tmux'": "from '../infrastructure/tmux/index'",
            "from './sandbox'": "from '../infrastructure/sandbox/index'",
            "from './agents'": "from '../domain/agents/index'",
            "from './sandbox/types'": "from '../infrastructure/sandbox/types'",
            "from './agents/types'": "from '../domain/agents/types'",
            "from './io'": "from '../infrastructure/io/index'",
            "from './core/config/manager'": "from '../infrastructure/config/manager'",
            "from './templates/loader'": "from '../domain/templates/loader'",
            "from './templates/types'": "from '../domain/templates/types'",
            "from './core/providers'": "from './providers'",
            "from './core/backlog'": "from '../domain/backlog/index'",
            "import('./core/backlog')": "import('../domain/backlog/index')",
            "import('./templates/types')": "import('../domain/templates/types')",
            "from './branches/types'": "from '../domain/branches/types'",
          }
          p = Path('src/application/workflow-engine.ts'); s = p.read_text()
          for a,b in repl.items(): s=s.replace(a,b)
          s=s.replace("import { loadModules, parseModuleParams } from './modules/_registry';", "import { loadModules, parseModuleParams } from './modules/_registry';\nimport type { ModuleParams } from './modules/_registry';")
          s=s.replace('private extParams: Record<string, unknown> = {};', 'private extParams: ModuleParams = {};')
          p.write_text(s)

          files = {
            'src/application/project-context.ts': [('from \'./modules/project-resolver\'', 'from \'./project-resolver\'')],
            'src/application/workflows/run-cmd.ts': [('createTrackerClient','createTracker')],
            'src/cli/commands/escalate.ts': [('createGitLabClient','createGitLabTracker')],
            'src/cli/commands/kanban.ts': [("../../domain/tracker/index.js","../../application/tracker-provider-factory")],
            'src/views/app/DashboardEntry.tsx': [('createManagementProviderBundle','createManagementProviders')],
            'src/views/board/data/fetcher.ts': [('createGitHubClient','createGitHubTracker'),('createGitLabClient','createGitLabTracker'),('detectGitLabProject','resolveGitLabProject')],
            'src/views/board/registry/loading-init.ts': [('detectPlatform','resolvePlatform'),('detectProject','resolveTrackerProject'),('createTrackerClient','createTracker')],
          }
          for fn,pairs in files.items():
            p=Path(fn); s=p.read_text()
            for a,b in pairs: s=s.replace(a,b)
            p.write_text(s)

          p=Path('src/domain/tracker/types.ts'); s=p.read_text()
          if "export type { AcceptanceCriteria } from './ac-types';" not in s:
            s += "\nexport type { AcceptanceCriteria } from './ac-types';\n"
          p.write_text(s)
          p=Path('src/domain/tracker/index.ts'); s=p.read_text()
          if "import type { Platform } from './types';" not in s:
            s="import type { Platform } from './types';\n"+s
          p.write_text(s)
          PY
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          pnpm rebuild node-pty --reporter=append-only
          pnpm rebuild esbuild --reporter=append-only
          pnpm run architecture:check
          pnpm run typecheck
          rm .github/workflows/restore-workflow-engine.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/restore-workflow-engine.yml
          git commit -m 'fix: complete aggressive architecture API migration'
          git push origin refactor/architecture-aggressive
