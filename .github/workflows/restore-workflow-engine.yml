name: one-time-restore-workflow-engine
on:
  push:
    branches:
      - refactor/architecture-aggressive
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Restore complete workflow-engine and migrate imports
        shell: bash
        run: |
          set -euo pipefail
          git show cada97afcab91739a1694c21e09551741fdb8a15:src/application/workflow-engine.ts > src/application/workflow-engine.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/application/workflow-engine.ts')
          s = p.read_text()
          s = s.replace("from './core/git'", "from '../infrastructure/git/index'")
          s = s.replace("from './core/tmux'", "from '../infrastructure/tmux/index'")
          s = s.replace("from './sandbox'", "from '../infrastructure/sandbox/index'")
          s = s.replace("from './agents'", "from '../domain/agents/index'")
          s = s.replace("from './sandbox/types'", "from '../infrastructure/sandbox/types'")
          s = s.replace("from './agents/types'", "from '../domain/agents/types'")
          s = s.replace("from './io'", "from '../infrastructure/io/index'")
          s = s.replace("from './core/config/manager'", "from '../infrastructure/config/manager'")
          s = s.replace("from './templates/loader'", "from '../domain/templates/loader'")
          s = s.replace("from './templates/types'", "from '../domain/templates/types'")
          s = s.replace("from './core/providers'", "from './providers'")
          s = s.replace("from './core/backlog'", "from '../domain/backlog/index'")
          s = s.replace("import('./core/backlog')", "import('../domain/backlog/index')")
          s = s.replace("import('./templates/types')", "import('../domain/templates/types')")
          s = s.replace("import type { Step, StepResult } from './templates/types';", "import type { Step, StepResult } from '../domain/templates/types';")
          s = s.replace("import type { BranchHandle } from './branches/types';", "import type { BranchHandle } from '../domain/branches/types';")
          s = s.replace("import { loadModules, parseModuleParams } from './modules/_registry';", "import { loadModules, parseModuleParams } from './modules/_registry';\nimport type { ModuleParams } from './modules/_registry';")
          s = s.replace("private extParams: Record<string, unknown> = {};", "private extParams: ModuleParams = {};")
          p.write_text(s)
          PY
      - name: Verify architecture and typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          pnpm rebuild node-pty --reporter=append-only
          pnpm rebuild esbuild --reporter=append-only
          pnpm run architecture:check
          pnpm run typecheck
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-workflow-engine.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/application/workflow-engine.ts .github/workflows/restore-workflow-engine.yml
          git commit -m 'fix: restore workflow engine implementation after architecture migration'
          git push origin refactor/architecture-aggressive
