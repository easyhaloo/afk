name: Sync architecture branch with main

on:
  push:
    branches:
      - refactor/architecture-aggressive

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: sync refactor branch with main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already contained in HEAD"
            exit 0
          fi
          git merge origin/main --no-edit

      - name: Remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-dashboard-diagnostics.yml
          rm -f .github/workflows/patch-dashboard-entry-test.yml
          rm -f .github/workflows/sync-main-once.yml
          git add -A .github/workflows
          git commit -m "chore: sync refactor branch with main"

      - name: Push merged branch
        run: git push origin HEAD:refactor/architecture-aggressive
