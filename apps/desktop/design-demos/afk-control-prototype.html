<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AFK Control · 桌面端整体重设计原型</title>
<style>
/* ============================================================================
   AFK Control 视觉系统 v2
   ----------------------------------------------------------------------------
   设计意图：本地工程运维控制台。密度优先，语义优先，无装饰。
   范围：全部 renderer 表面（运行中心、看板、工作项、工作流、Agent、资源、
         SSH、活动记录、设置）。

   单一强调色规则（COLOR LOCK）
     全局只有一个品牌强调色：running green。它同时是运行状态的语义色。
     语义色板 = 同一绿色系的填充/描边区分 + 琥珀（待处理）+ 红（失败）。
     任何组件不得引入第五种色相。
   圆角规则（SHAPE LOCK）
     4px 圆点与色块内芯 / 6px 按钮与输入框 / 10px 面板与卡片 / 999px 药丸与头像。
   z 轴刻度（SCALE）
     0 基础流 / 10 粘性表头 / 20 浮层 / 30 抽屉 / 40 对话框。
   字体
     CJK 优先系统无衬线；所有数字、ID、路径、时间戳、令牌计数一律等宽。
   ========================================================================== */

/* ---------- 1. 令牌层 ---------- */
:root {
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  --r-dot: 4px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-pill: 999px;

  --row-h: 46px;
  --sidebar-w: 236px;
  --z-sticky: 10;
  --z-pop: 20;
  --z-drawer: 30;
  --z-modal: 40;

  --ease: cubic-bezier(.23, 1, .32, 1);
  --dur-fast: 110ms;
  --dur: 180ms;
}

html[data-theme="dark"] {
  --void:        #0d0e10;
  --chrome:      #131417;
  --surface:     #17191c;
  --raised:      #1e2126;
  --raised-2:    #24272d;
  --inset:       #101113;
  --line:        #26292e;
  --line-strong: #353940;
  --text:        #e4e7ea;
  --text-mid:    #a2a8b1;
  --text-quiet:  #858b94; /* 5.0:1 on --surface，元数据正文仍需 AA */
  --accent:      #58b489;
  --accent-ink:  #0d1a14;
  --accent-soft: rgba(88, 180, 137, .13);
  --accent-line: rgba(88, 180, 137, .40);
  --warn:        #d5a049;
  --warn-soft:   rgba(213, 160, 73, .13);
  --warn-line:   rgba(213, 160, 73, .38);
  --fail:        #e0655f;
  --fail-soft:   rgba(224, 101, 95, .13);
  --fail-line:   rgba(224, 101, 95, .38);
  --shadow-pop:  0 14px 34px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

html[data-theme="light"] {
  --void:        #e4e7ea;
  --chrome:      #f2f4f6;
  --surface:     #ffffff;
  --raised:      #ffffff;
  --raised-2:    #f4f6f7;
  --inset:       #f7f8fa;
  --line:        #e2e5e9;
  --line-strong: #cbd0d6;
  --text:        #1a1d21;
  --text-mid:    #5c636d;
  --text-quiet:  #6a7078; /* 4.9:1 on white，元数据正文仍需 AA */
  --accent:      #256b4a;
  --accent-ink:  #ffffff;
  --accent-soft: rgba(43, 129, 88, .10);
  --accent-line: rgba(43, 129, 88, .34);
  --warn:        #9a6512;
  --warn-soft:   rgba(154, 101, 18, .10);
  --warn-line:   rgba(154, 101, 18, .32);
  --fail:        #bf4038;
  --fail-soft:   rgba(191, 64, 56, .10);
  --fail-line:   rgba(191, 64, 56, .32);
  --shadow-pop:  0 12px 28px rgba(26, 32, 40, .14);
  color-scheme: light;
}

/* ---------- 2. 基础 ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 13px; height: 13px; }
.ico-lg { width: 19px; height: 19px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ---------- 3. 外框 ---------- */
.frame { display: grid; height: 100dvh; grid-template-rows: 30px minmax(0, 1fr); }
.titlebar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: var(--chrome);
  color: var(--text-quiet);
  font-size: 11px;
  user-select: none;
}
.traffic { display: flex; gap: 8px; padding-left: 12px; }
.traffic i { width: 11px; height: 11px; border-radius: var(--r-dot); background: var(--line-strong); }
.traffic i:nth-child(1) { background: #e0685f; }
.traffic i:nth-child(2) { background: #d7a24c; }
.traffic i:nth-child(3) { background: #5cb172; }
.titlebar > b { font-weight: 600; color: var(--text-mid); letter-spacing: .02em; }
.titlebar-right { display: flex; gap: 10px; align-items: center; justify-content: flex-end; padding-right: 12px; }

.app { display: grid; min-height: 0; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }

/* ---------- 4. 侧栏 ---------- */
.sidebar {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: 16px 10px 10px;
  border-right: 1px solid var(--line);
  background: var(--chrome);
}
.brand { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 9px; padding: 0 8px 14px; }
.brand-mark {
  display: grid; width: 24px; height: 24px; place-items: center;
  background: var(--accent); color: var(--accent-ink);
  font-size: 12px; font-weight: 800;
  clip-path: polygon(50% 0, 100% 100%, 66% 100%, 50% 58%, 34% 100%, 0 100%);
}
.brand b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.brand small { display: block; margin-top: 1px; color: var(--text-quiet); font-size: 9px; }

.ws {
  display: flex; align-items: center; gap: 8px; width: 100%;
  min-height: 34px; padding: 0 9px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); color: var(--text-mid); font-size: 12px;
  text-align: left;
}
.ws:hover { border-color: var(--line-strong); color: var(--text); }
.ws .ico { color: var(--text-quiet); }
.ws span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws em { margin-left: auto; color: var(--text-quiet); font-size: 10px; font-style: normal; }

.nav { display: grid; gap: 14px; margin-top: 16px; overflow-y: auto; }
.nav-group { display: grid; gap: 1px; }
.nav-group > span { padding: 0 9px 5px; color: var(--text-quiet); font-size: 10px; }
.nav-item {
  position: relative;
  display: flex; align-items: center; gap: 9px;
  min-height: 32px; padding: 0 9px;
  border-radius: var(--r-sm); color: var(--text-mid); font-size: 12px;
  text-align: left;
  transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease;
}
.nav-item .ico { color: var(--text-quiet); transition: color var(--dur-fast) ease; }
.nav-item:hover { background: var(--raised-2); color: var(--text); }
.nav-item:hover .ico { color: var(--text-mid); }
.nav-item.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.nav-item.active .ico { color: var(--accent); }
.nav-item.active::before {
  content: ""; position: absolute; left: -10px; top: 8px;
  width: 2px; height: 16px; border-radius: 0 2px 2px 0; background: var(--accent);
}
.nav-item .count {
  margin-left: auto; padding: 1px 5px; border-radius: var(--r-pill);
  background: var(--raised-2); color: var(--text-quiet);
  font-family: var(--font-mono); font-size: 9px; line-height: 1.5;
}
.nav-item .count.alarm { background: var(--warn-soft); color: var(--warn); }

.side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.side-foot .nav-item { min-height: 30px; font-size: 11px; }
.side-foot .nav-item .ico { width: 14px; height: 14px; }

/* ---------- 5. 主区外壳 ---------- */
.main { display: grid; min-height: 0; grid-template-rows: 46px minmax(0, 1fr); background: var(--surface); }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px 0 20px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.topbar h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.topbar .sub { color: var(--text-quiet); font-size: 11px; }
.topbar-actions { display: flex; align-items: center; gap: 7px; margin-left: auto; }
.view { overflow-y: auto; padding: 16px 20px 28px; display: flex; flex-direction: column; }
.view > section, .view > .run-layout { flex: 1; }
/* 单面板视图（工作项、Agent、仓库、SSH）让面板吃满视口高度，
   空状态落在面板内部而不是悬在面板下方，看起来是有意留白而不是漏排。
   只作用于显式标注 .stack 的视图：网格型视图（.run-layout / .board /
   .flow-wrap）自己管布局，不走这条纵向流。 */
.view > section.stack { display: flex; flex-direction: column; }
.view > section.stack > .panel:last-child { flex: 1; display: flex; flex-direction: column; }
.view > section.stack > .toolbar, .view > section.stack > .stats { flex: none; }

/* ---------- 6. 控件 ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--raised); color: var(--text-mid);
  font-size: 12px; white-space: nowrap;
  transition: background-color var(--dur-fast) ease, border-color var(--dur-fast) ease, color var(--dur-fast) ease, transform var(--dur-fast) ease;
}
.btn:hover { border-color: var(--line-strong); background: var(--raised-2); color: var(--text); }
.btn:active { transform: translateY(1px); }
.btn .ico { color: var(--text-quiet); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn.primary { border-color: transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent); filter: brightness(1.1); color: var(--accent-ink); }
.btn.primary .ico { color: currentColor; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--raised-2); }
.btn.danger { color: var(--fail); }
.btn.danger:hover { border-color: var(--fail-line); background: var(--fail-soft); color: var(--fail); }
.btn[disabled] { opacity: .45; pointer-events: none; }

.seg { display: inline-flex; gap: 1px; padding: 2px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--inset); }
.seg button {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px; border-radius: 4px;
  color: var(--text-quiet); font-size: 11px; white-space: nowrap;
  transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease;
}
.seg button:hover { color: var(--text-mid); }
.seg button.on { background: var(--raised-2); color: var(--text); font-weight: 600; }
.seg button em { font-family: var(--font-mono); font-style: normal; opacity: .7; }

.field {
  display: flex; align-items: center; gap: 7px;
  height: 28px; padding: 0 9px;
  border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--inset);
  color: var(--text-quiet);
  transition: border-color var(--dur-fast) ease;
}
.field:focus-within { border-color: var(--accent-line); }
.field input { width: 100%; min-width: 0; border: 0; background: none; outline: none; font-size: 12px; }
.field input::placeholder { color: var(--text-quiet); }
.field .ico { width: 14px; height: 14px; }

select.pick {
  height: 28px; padding: 0 24px 0 9px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--raised) no-repeat right 7px center/10px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 12px center, right 7px center;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  color: var(--text-mid); font-size: 12px; appearance: none;
}
select.pick:hover { border-color: var(--line-strong); color: var(--text); }

/* 状态药丸：语义色 + 文字，不靠裸色点传达状态 */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 19px; padding: 0 7px; border-radius: var(--r-pill);
  font-size: 10px; font-weight: 600; white-space: nowrap;
}
.pill .ico { width: 11px; height: 11px; stroke-width: 2.1; }
.pill.run    { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.pill.done   { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.pill.wait   { background: var(--warn-soft);   color: var(--warn);   box-shadow: inset 0 0 0 1px var(--warn-line); }
.pill.fail   { background: var(--fail-soft);   color: var(--fail);   box-shadow: inset 0 0 0 1px var(--fail-line); }
.pill.idle   { background: var(--raised-2);    color: var(--text-quiet); box-shadow: inset 0 0 0 1px var(--line); }
.pill.live::after {
  content: ""; width: 4px; height: 4px; border-radius: var(--r-dot);
  background: currentColor;
  animation: beat 1.8s var(--ease) infinite;
}

/* ---------- 7. 统计条：数据用留白呼吸，不用卡片阵列 ---------- */
.stats { display: flex; align-items: baseline; gap: 0; margin-bottom: 14px; flex-wrap: wrap; }
.stats div { display: flex; align-items: baseline; gap: 7px; padding: 0 18px; border-left: 1px solid var(--line); }
.stats div:first-child { padding-left: 0; border-left: 0; }
.stats b { font-family: var(--font-mono); font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.stats span { color: var(--text-quiet); font-size: 11px; }
.stats .hot b { color: var(--warn); }
.stats .bad b { color: var(--fail); }
.stats .ok b { color: var(--accent); }

/* ---------- 8. 面板 ---------- */
.panel { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.panel > header {
  display: flex; align-items: center; gap: 10px;
  min-height: 40px; padding: 0 12px;
  border-bottom: 1px solid var(--line);
}
.panel > header b { font-size: 12px; font-weight: 650; }
.panel > header .note { color: var(--text-quiet); font-size: 11px; }
.panel > header .tools { display: flex; align-items: center; gap: 7px; margin-left: auto; }

/* ---------- 9. 运行列表 ---------- */
.run-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: stretch; }
.run-layout > div { display: flex; min-width: 0; flex-direction: column; }
.run-layout > div > .panel { flex: 1; display: flex; flex-direction: column; }
.run-layout > div > .panel > .run-col-head { flex: none; }
.run-layout > div > .stats, .run-layout > div > .toolbar { flex: none; }
.run-col-head {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) 74px 96px;
  gap: 12px; align-items: center;
  height: 28px; padding: 0 12px;
  border-bottom: 1px solid var(--line);
  color: var(--text-quiet); font-size: 10px;
  position: sticky; top: 0; z-index: var(--z-sticky);
  background: var(--surface);
}
.run-col-head span:nth-child(3), .run-col-head span:nth-child(4) { text-align: right; }
.run-row {
  position: relative; display: grid;
  grid-template-columns: 22px minmax(0, 1fr) 74px 96px;
  gap: 12px; align-items: center;
  width: 100%; min-height: var(--row-h); padding: 7px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  transition: background-color var(--dur-fast) ease;
}
.run-row:last-child { border-bottom: 0; }
.run-row:hover { background: var(--raised); }
.run-row.sel { background: var(--raised); }
.run-row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.glyph {
  display: grid; width: 20px; height: 20px; place-items: center;
  border-radius: var(--r-sm);
}
.glyph .ico { width: 13px; height: 13px; }
.glyph.run  { background: var(--accent-soft); color: var(--accent); }
.glyph.done { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.glyph.wait { background: var(--warn-soft);   color: var(--warn); }
.glyph.fail { background: var(--fail-soft);   color: var(--fail); }
.glyph.idle { background: var(--raised-2);    color: var(--text-quiet); }

.run-main { min-width: 0; }
.run-main b { display: block; overflow: hidden; font-size: 12.5px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.run-main small {
  display: flex; gap: 7px; margin-top: 2px;
  overflow: hidden; color: var(--text-quiet);
  font-family: var(--font-mono); font-size: 10px; text-overflow: ellipsis; white-space: nowrap;
}
.run-main small i { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
.run-main small .sep { flex: none; opacity: .5; }
.run-dur { text-align: right; font-family: var(--font-mono); font-size: 10.5px; }
.run-time { text-align: right; font-size: 10.5px; color: var(--text-quiet); white-space: nowrap; }
.run-row:hover .run-dur, .run-row:hover .run-time, .run-row.sel .run-dur, .run-row.sel .run-time { color: var(--text-mid); }

/* 新事件到达：一次高亮，然后归位 */
@keyframes arrive { from { background: var(--accent-soft); } to { background: transparent; } }
.run-row.new { animation: arrive 900ms var(--ease) both; }

/* ---------- 10. 检查器 ---------- */
.inspector { position: sticky; top: 0; display: grid; gap: 0; }
.insp-head { padding: 13px 14px 12px; border-bottom: 1px solid var(--line); }
.insp-head .meta { display: flex; align-items: center; gap: 7px; color: var(--text-quiet); font-family: var(--font-mono); font-size: 10px; }
.insp-head h2 { margin: 8px 0 0; font-size: 14px; font-weight: 650; line-height: 1.35; letter-spacing: -.01em; }
.insp-sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.insp-sec > span { display: block; margin-bottom: 8px; color: var(--text-quiet); font-size: 10px; }
.kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 10px; font-size: 11.5px; }
.kv dt { color: var(--text-quiet); }
.kv dd { margin: 0; overflow: hidden; font-family: var(--font-mono); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 3px; border-radius: var(--r-pill); background: var(--raised-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.insp-foot { display: flex; gap: 7px; padding: 12px 14px; }
.insp-foot .btn { flex: 1; justify-content: center; }

.stream { display: grid; gap: 0; }
.stream li { display: grid; grid-template-columns: 46px 16px minmax(0, 1fr); gap: 9px; align-items: baseline; padding: 6px 0; list-style: none; }
.stream li time { font-family: var(--font-mono); font-size: 10px; color: var(--text-quiet); }
.stream li p { margin: 0; font-size: 11.5px; color: var(--text-mid); }
.stream li i { display: block; width: 5px; height: 5px; border-radius: var(--r-dot); background: var(--line-strong); }
.stream li.ok i { background: var(--accent); }
.stream li.bad i { background: var(--fail); }
.stream li.warn i { background: var(--warn); }

/* ---------- 11. 看板 ---------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.lane { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--inset); overflow: hidden; }
.lane > header { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 11px; border-bottom: 1px solid var(--line); }
.lane > header b { font-size: 11.5px; font-weight: 650; }
.lane > header em { margin-left: auto; font-family: var(--font-mono); font-size: 10px; font-style: normal; color: var(--text-quiet); }
.lane > header .mark { width: 6px; height: 6px; border-radius: var(--r-dot); }
.lane.run > header .mark { background: var(--accent); }
.lane.done > header .mark { background: var(--accent); opacity: .55; }
.lane.wait > header .mark { background: var(--warn); }
.lane.fail > header .mark { background: var(--fail); }
.lane .cards { display: grid; gap: 6px; padding: 8px; min-height: 90px; }
.card {
  display: block; width: 100%; padding: 9px 10px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--raised); text-align: left;
  transition: border-color var(--dur-fast) ease, transform var(--dur-fast) ease, background-color var(--dur-fast) ease;
}
.card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.card.sel { border-color: var(--accent-line); background: var(--accent-soft); }
.card b { display: block; font-size: 12px; font-weight: 600; line-height: 1.4; }
.card small { display: block; margin-top: 4px; overflow: hidden; font-family: var(--font-mono); font-size: 10px; color: var(--text-quiet); text-overflow: ellipsis; white-space: nowrap; }
.card .foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.card .foot time { margin-left: auto; font-size: 10px; color: var(--text-quiet); }
.lane-empty { display: grid; place-items: center; min-height: 72px; color: var(--text-quiet); font-size: 11px; }

/* ---------- 12. 工作项 ---------- */
.toolbar { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar .field { width: 260px; }
.item {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto;
  gap: 12px; align-items: start;
  width: 100%; padding: 13px 12px 13px 13px;
  border-bottom: 1px solid var(--line); text-align: left;
  transition: background-color var(--dur-fast) ease;
}
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--raised); }
.item .idx { padding-top: 3px; font-family: var(--font-mono); font-size: 10px; color: var(--text-quiet); }
.item .item-side { align-self: center; }
.item b { font-size: 12.5px; font-weight: 600; line-height: 1.4; }
.item .desc { display: -webkit-box; margin-top: 4px; overflow: hidden; color: var(--text-mid); font-size: 11.5px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: var(--r-pill); background: var(--raised-2); color: var(--text-quiet); font-size: 10px; }
.tag.req { background: var(--warn-soft); color: var(--warn); }
.tag.mono { font-family: var(--font-mono); }
.item-side { display: flex; align-items: center; gap: 10px; }
.item-side .foot { display: flex; align-items: center; gap: 7px; color: var(--text-quiet); font-family: var(--font-mono); font-size: 10px; }

/* ---------- 13. 工作流画布 ---------- */
.flow-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; height: calc(100dvh - 46px - 44px); min-height: 420px; }
.flow-inspector { display: flex; flex-direction: column; }
.flow-inspector .insp-foot { margin-top: auto; }
.fld { display: grid; gap: 5px; margin-bottom: 10px; }
.fld:last-child { margin-bottom: 0; }
.fld > span { color: var(--text-quiet); font-size: 10px; }
.fld input, .fld textarea {
  width: 100%; padding: 6px 8px; resize: vertical;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--inset); color: var(--text); font-size: 11.5px; outline: none;
}
.fld input:focus, .fld textarea:focus { border-color: var(--accent-line); }
.stage {
  position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background-color: var(--inset);
  background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
  background-size: 22px 22px;
}
.world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.edge { fill: none; stroke: var(--line-strong); stroke-width: 1.4; }
.node {
  position: absolute; width: 172px; padding: 9px 10px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--raised); text-align: left;
  transition: border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease, transform var(--dur-fast) ease;
}
.node:hover { border-color: var(--line-strong); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.node.origin { background: var(--raised-2); }
.node .hd { display: flex; align-items: center; gap: 7px; }
.node .hd b { font-size: 11.5px; font-weight: 650; }
.node .hd em { margin-left: auto; font-family: var(--font-mono); font-size: 9px; font-style: normal; color: var(--text-quiet); }
.node p { margin: 5px 0 0; color: var(--text-quiet); font-size: 10.5px; line-height: 1.45; }
.node .who { display: flex; align-items: center; gap: 5px; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); color: var(--text-mid); font-size: 10px; }
.node .who .ico { width: 12px; height: 12px; color: var(--text-quiet); }
.node .who em { margin-left: auto; font-family: var(--font-mono); font-style: normal; font-size: 9px; color: var(--text-quiet); }
.stage-bar {
  position: absolute; left: 12px; right: 12px; bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.stage-bar .zoom { display: flex; align-items: center; gap: 1px; margin-left: auto; padding: 2px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--raised); }
.stage-bar .zoom button { width: 22px; height: 20px; border-radius: 4px; color: var(--text-quiet); }
.stage-bar .zoom button:hover { background: var(--raised-2); color: var(--text); }
.stage-bar .zoom em { padding: 0 6px; font-family: var(--font-mono); font-size: 10px; font-style: normal; color: var(--text-mid); }
.stage-bar > span { font-family: var(--font-mono); font-size: 10px; color: var(--text-quiet); }

/* ---------- 14. 通用：网格、列表、空态、骨架 ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.row-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 40px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); text-align: left;
  transition: background-color var(--dur-fast) ease;
}
.row-item:last-child { border-bottom: 0; }
.row-item:hover { background: var(--raised); }
.row-item .ico-box {
  display: grid; width: 26px; height: 26px; flex: none; place-items: center;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--inset); color: var(--text-mid);
}
.row-item .txt { min-width: 0; }
.row-item .txt b { display: block; overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.row-item .txt small { display: block; margin-top: 2px; overflow: hidden; color: var(--text-quiet); font-family: var(--font-mono); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.row-item .end { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--text-quiet); font-family: var(--font-mono); font-size: 10px; white-space: nowrap; }

.empty { display: grid; place-items: center; gap: 8px; min-height: 260px; padding: 32px; text-align: center; }
.empty .ico-box { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--inset); color: var(--text-quiet); }
.empty b { font-size: 13px; font-weight: 600; }
.empty p { max-width: 44ch; margin: 0; color: var(--text-quiet); font-size: 11.5px; line-height: 1.6; }

.sk { border-radius: var(--r-sm); background: linear-gradient(90deg, var(--raised) 25%, var(--raised-2) 37%, var(--raised) 63%); background-size: 400% 100%; animation: shimmer 1.5s ease infinite; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.sk-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) 70px; gap: 12px; align-items: center; height: var(--row-h); padding: 0 12px; border-bottom: 1px solid var(--line); }
.sk-row .sk:nth-child(1) { width: 20px; height: 20px; }
.sk-row .sk:nth-child(2) { height: 10px; }
.sk-row .sk:nth-child(3) { height: 10px; }

/* ---------- 15. 设置 ---------- */
.set-row { display: flex; align-items: center; gap: 14px; min-height: 46px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .lbl { min-width: 132px; }
.set-row .lbl b { display: block; font-size: 12px; font-weight: 600; }
.set-row .lbl small { display: block; margin-top: 2px; color: var(--text-quiet); font-size: 10.5px; }
.set-row .ctl { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.swatches { display: flex; gap: 6px; }
.swatch { width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); }
.swatch.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

/* ---------- 16. 终端抽屉 ---------- */
.sheet {
  position: absolute; inset: 0; z-index: var(--z-modal);
  display: grid; grid-template-rows: 34px minmax(0, 1fr);
  border-top: 1px solid var(--line-strong);
  background: var(--chrome);
  box-shadow: 0 -18px 44px rgba(0, 0, 0, .42);
}
.sheet > header { display: flex; align-items: center; gap: 9px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.sheet > header b { font-size: 11.5px; font-weight: 600; }
.sheet > header .ico { color: var(--text-quiet); }
.sheet > header em { font-family: var(--font-mono); font-size: 10px; font-style: normal; color: var(--text-quiet); }
.sheet > header .btn { margin-left: auto; }
.term {
  margin: 0; padding: 12px 14px; overflow: auto;
  background: var(--inset);
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.75; color: var(--text-mid);
  white-space: pre-wrap;
}
.term .g { color: var(--accent); }
.term .y { color: var(--warn); }
.term .r { color: var(--fail); }
.term .q { color: var(--text-quiet); }

/* ---------- 17. 视图切换动效：仅 180ms 位移淡入，无循环动画 ---------- */
@keyframes viewIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.view > section { animation: viewIn var(--dur) var(--ease) both; }
@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

/* 唯一允许的无限动画是运行中指示灯（语义：此刻确实有任务在跑） */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

function edgePath(a, b) {
  const x1 = a.x + 172, y1 = a.y + 34, x2 = b.x, y2 = b.y + 34;

  const mid = x2 - 18;
  return `M${x1} ${y1} H${mid} V${y2} H${x2}`;
}

// 画布自适应：真实应用同样按 stage 尺寸算 scale 与居中偏移。
// ponytail: 只做 fit-to-view，不做拖拽平移与缩放交互（原型范围）。
function fitStage() {
  const stage = $("[data-stage]"), world = $("[data-world]");
  if (!stage || !world) return;
  const pad = 32;
  const sw = stage.clientWidth - pad * 2, sh = stage.clientHeight - pad * 2;
  const gw = Math.max(...NODES.map(n => n.x)) + 172;
  const gh = Math.max(...NODES.map(n => n.y)) + 96;
  const scale = Math.min(1, sw / gw, sh / gh);
  const x = (stage.clientWidth - gw * scale) / 2 - Math.min(...NODES.map(n => n.x)) * scale;
  // 纵向偏上而不是几何居中：与真实应用一致，图不会孤零零浮在画布正中。
  const y = stage.clientHeight * 0.36 - (Math.min(...NODES.map(n => n.y)) + gh / 2) * scale;
  world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  const z = $("[data-zoom]");
  if (z) z.textContent = Math.round(scale * 100) + "%";
}

function render() {
  const actions = ACTIONS[current];
  $("#page-actions").innerHTML = actions ? actions() : "";
  const paint = VIEWS[current] || (() => `<div class="empty">
      <span class="ico-box">${icon("circle-dashed", "ico-lg")}</span>
      <b>视图尚未在原型中展开</b>
      <p>该视图沿用现有的 ${$("#page-title").textContent} 结构，原型只覆盖主链路。</p>
    </div>`);
  // 首屏先给骨架，模拟真实快照加载
  $("#view").innerHTML = skeleton();
  requestAnimationFrame(() => {
    $("#view").innerHTML = paint();
    wire();
    fitStage();
  });
}

function wire() {
  $("#view").querySelectorAll("[data-run]").forEach(el => el.onclick = () => {
    selectedRun = el.dataset.run;
    if (current === "runs" || current === "board") render();
  });
  $("#view").querySelectorAll("[data-f]").forEach(el => el.onclick = () => {
    runFilter = el.dataset.f;
    render();
  });
  $("#page-actions").querySelectorAll("[data-m]").forEach(el => el.onclick = () => {
    if (el.dataset.m === "board") go("board");
    if (el.dataset.m === "queue") go("runs");
  });
}
