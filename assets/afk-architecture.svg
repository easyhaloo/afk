<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">AFK — Autonomous Execution Architecture</title>
  <desc id="desc">Current AFK architecture showing CLI, desktop and skill entry points, shared packages, provider and agent adapters, managed execution lifecycle, and audit and observation paths.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d35"/>
      <stop offset="1" stop-color="#243e68"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#dce9ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #17243b; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #9fb6dc; }
      .title { font-size: 34px; font-weight: 750; fill: #ffffff; }
      .subtitle { font-size: 15px; fill: #cfdaeb; }
      .section { font-size: 15px; font-weight: 750; letter-spacing: 1.3px; fill: #334155; }
      .card { fill: #ffffff; stroke: #d7e0ec; stroke-width: 1.5; }
      .card-title { font-size: 17px; font-weight: 750; }
      .body { font-size: 13px; fill: #475569; }
      .small { font-size: 11.5px; fill: #64748b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #334155; }
      .pkg-title { font-size: 17px; font-weight: 800; }
      .pkg-name { font-size: 11px; font-weight: 700; letter-spacing: .8px; fill: #64748b; }
      .step-num { font-size: 11px; font-weight: 800; fill: #ffffff; }
      .step-title { font-size: 15px; font-weight: 750; }
      .step-body { font-size: 12px; fill: #526174; }
      .arrow-line { fill: none; stroke: #8292a8; stroke-width: 2; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#blueArrow); }
      .dashed { stroke-dasharray: 6 6; }
      .pill { fill: #f1f5f9; stroke: #e2e8f0; }
      .pill-text { font-size: 10.5px; font-weight: 650; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="1320" fill="#f4f7fb"/>
  <rect x="0" y="0" width="1600" height="112" fill="url(#header)"/>
  <text x="58" y="34" class="kicker">CURRENT IMPLEMENTATION · MONOREPO VIEW</text>
  <text x="58" y="76" class="title">AFK — Autonomous Execution Architecture</text>
  <text x="1540" y="47" text-anchor="end" class="subtitle">Shared runtime · Replaceable adapters · Evidence-first delivery</text>

  <!-- Entry points -->
  <text x="58" y="145" class="section">PRODUCT SURFACES &amp; AGENT INTEGRATION</text>

  <rect x="58" y="165" width="470" height="130" rx="14" class="card"/>
  <rect x="58" y="165" width="7" height="130" rx="4" fill="#2563eb"/>
  <text x="82" y="197" class="card-title">AFK CLI + Ink TUI</text>
  <text x="82" y="222" class="body">Commander command surface · interactive dashboard</text>
  <text x="82" y="246" class="body">Run / execute / loop · backlog · QA · observe · operations</text>
  <rect x="82" y="261" width="116" height="22" rx="11" class="pill"/>
  <text x="140" y="276" text-anchor="middle" class="pill-text">apps/cli</text>

  <rect x="565" y="165" width="470" height="130" rx="14" class="card"/>
  <rect x="565" y="165" width="7" height="130" rx="4" fill="#0f766e"/>
  <text x="589" y="197" class="card-title">AFK Control Desktop</text>
  <text x="589" y="222" class="body">React renderer → typed preload IPC → Electron Main</text>
  <text x="589" y="246" class="body">Main services + detached Node execution Worker</text>
  <rect x="589" y="261" width="148" height="22" rx="11" class="pill"/>
  <text x="663" y="276" text-anchor="middle" class="pill-text">apps/desktop</text>
  <text x="1015" y="277" text-anchor="end" class="small">Calls shared Runtime; does not spawn the AFK CLI</text>

  <rect x="1072" y="165" width="470" height="130" rx="14" class="card"/>
  <rect x="1072" y="165" width="7" height="130" rx="4" fill="#7c3aed"/>
  <text x="1096" y="197" class="card-title">Skills &amp; Knowledge</text>
  <text x="1096" y="222" class="body">Agent playbooks: research · PRD · implementation · testing · QA</text>
  <text x="1096" y="246" class="body">Wiki knowledge workflow (standalone Python CLI)</text>
  <rect x="1096" y="261" width="146" height="22" rx="11" class="pill"/>
  <text x="1169" y="276" text-anchor="middle" class="pill-text">skills/ + plugin</text>

  <path d="M293 295 V330 H565 V357" class="blue-line"/>
  <path d="M800 295 V357" class="blue-line"/>
  <path d="M1307 295 V557 H612 V588" class="arrow-line dashed"/>
  <text x="1320" y="322" class="small">Skills guide agent behavior</text>

  <!-- Shared packages -->
  <text x="58" y="347" class="section">SHARED TYPESCRIPT WORKSPACE · DEPENDENCY DIRECTION</text>

  <rect x="58" y="370" width="310" height="150" rx="14" fill="#ffffff" stroke="#b9c8dc" stroke-width="1.5"/>
  <rect x="58" y="370" width="310" height="8" rx="4" fill="#0f766e"/>
  <text x="82" y="407" class="pkg-title">Core</text>
  <text x="82" y="428" class="pkg-name">@afk/core</text>
  <text x="82" y="459" class="body">Pure business contracts</text>
  <text x="82" y="481" class="body">Models · events · reducer · policies · ports</text>
  <text x="82" y="502" class="small">No Node.js, Electron, React or Provider SDK</text>

  <rect x="405" y="370" width="330" height="150" rx="14" fill="#ffffff" stroke="#b9c8dc" stroke-width="1.5"/>
  <rect x="405" y="370" width="330" height="8" rx="4" fill="#2563eb"/>
  <text x="429" y="407" class="pkg-title">Application</text>
  <text x="429" y="428" class="pkg-name">@afk/application</text>
  <text x="429" y="459" class="body">Shared use cases and query contracts</text>
  <text x="429" y="481" class="body">Inventory · execution · observation</text>
  <text x="429" y="502" class="small">Depends on Core only</text>

  <rect x="772" y="370" width="525" height="150" rx="14" fill="url(#runtime)" stroke="#8bb2f5" stroke-width="1.8"/>
  <rect x="772" y="370" width="525" height="8" rx="4" fill="#1d4ed8"/>
  <text x="796" y="407" class="pkg-title">Runtime</text>
  <text x="796" y="428" class="pkg-name">@afk/runtime · EXECUTION &amp; ADAPTER COMPOSITION</text>
  <text x="796" y="459" class="body">Workflow Engine · WorkflowRunner · PlanExecutor · templates</text>
  <text x="796" y="481" class="body">executeWorkItem · QARunner · LoopRunner · session / handoff</text>
  <text x="796" y="502" class="small">Domain rules + infrastructure adapters · Node-side execution boundary</text>

  <rect x="1330" y="370" width="212" height="150" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="1330" y="370" width="212" height="8" rx="4" fill="#7c3aed"/>
  <text x="1350" y="407" class="pkg-title">Workflow Graph</text>
  <text x="1350" y="428" class="pkg-name">@afk/workflow-graph</text>
  <text x="1350" y="459" class="body">Graph IR</text>
  <text x="1350" y="481" class="body">Projection · layout</text>
  <text x="1350" y="502" class="body">Validation · routing</text>

  <path d="M368 445 H405" class="blue-line"/>
  <path d="M735 445 H772" class="blue-line"/>
  <path d="M1330 445 H1300" class="arrow-line"/>
  <text x="386" y="432" text-anchor="middle" class="small">depends</text>
  <text x="754" y="432" text-anchor="middle" class="small">depends</text>
  <text x="1315" y="432" text-anchor="middle" class="small">used by</text>

  <!-- Runtime adapters -->
  <text x="58" y="559" class="section">RUNTIME ADAPTERS &amp; EXECUTION SUBSTRATE</text>

  <rect x="58" y="585" width="355" height="170" rx="14" class="card"/>
  <rect x="58" y="585" width="355" height="7" rx="4" fill="#0891b2"/>
  <text x="82" y="621" class="card-title">Provider Adapters</text>
  <text x="82" y="648" class="body">BacklogProvider · BranchProvider · ChangeProvider</text>
  <text x="82" y="673" class="body">GitHub / GitLab implementations</text>
  <text x="82" y="698" class="body">Canonical work-item identity and relationships</text>
  <text x="82" y="729" class="small">Provider backlog remains the business state authority</text>

  <rect x="435" y="585" width="355" height="170" rx="14" class="card"/>
  <rect x="435" y="585" width="355" height="7" rx="4" fill="#7c3aed"/>
  <text x="459" y="621" class="card-title">Agent Providers</text>
  <text x="459" y="648" class="body">Claude Code · Codex · Cursor</text>
  <text x="459" y="673" class="body">OpenCode · Pi · GitHub Copilot</text>
  <text x="459" y="698" class="body">Capability-aware process / session adapters</text>
  <text x="459" y="729" class="small">Replaceable coding-agent runtimes</text>

  <rect x="812" y="585" width="355" height="170" rx="14" class="card"/>
  <rect x="812" y="585" width="355" height="7" rx="4" fill="#d97706"/>
  <text x="836" y="621" class="card-title">Sandbox &amp; Process Control</text>
  <text x="836" y="648" class="body">Local · Docker · Podman</text>
  <text x="836" y="673" class="body">tmux · process lifecycle · streaming / interrupt</text>
  <text x="836" y="698" class="body">Session capture · resume / handoff · watchdog</text>
  <text x="836" y="729" class="small">Isolation and runtime capability are explicit</text>

  <rect x="1189" y="585" width="353" height="170" rx="14" class="card"/>
  <rect x="1189" y="585" width="353" height="7" rx="4" fill="#64748b"/>
  <text x="1213" y="621" class="card-title">Workspace &amp; Persistence</text>
  <text x="1213" y="648" class="body">Git branches · worktrees · multi-repo preparation</text>
  <text x="1213" y="673" class="body">Config · inventory · local runtime records</text>
  <text x="1213" y="698" class="body">Execution journal · budget · append-only events</text>
  <text x="1213" y="729" class="small">~/.afk/ + workspace-local evidence</text>

  <path d="M930 520 V548 H235 V585" class="arrow-line"/>
  <path d="M1035 520 V548 H612 V585" class="arrow-line"/>
  <path d="M1140 520 V548 H989 V585" class="arrow-line"/>
  <path d="M1230 520 V548 H1365 V585" class="arrow-line"/>

  <!-- Lifecycle -->
  <text x="58" y="805" class="section">MANAGED EXECUTION LIFECYCLE</text>
  <text x="1542" y="805" text-anchor="end" class="small">AFK consumes already-decomposed work items; planning stays upstream</text>

  <rect x="48" y="835" width="238" height="176" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="75" cy="864" r="14" fill="#0f766e"/><text x="75" y="868" text-anchor="middle" class="step-num">01</text>
  <text x="98" y="869" class="step-title">Provider Backlog</text>
  <text x="68" y="905" class="step-body">Ready / rework work item</text>
  <text x="68" y="927" class="step-body">Acceptance criteria + dependencies</text>
  <text x="68" y="949" class="step-body">Canonical identity</text>
  <text x="68" y="982" class="small">GitHub / GitLab is the source of truth</text>

  <rect x="302" y="835" width="238" height="176" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="329" cy="864" r="14" fill="#2563eb"/><text x="329" y="868" text-anchor="middle" class="step-num">02</text>
  <text x="352" y="869" class="step-title">Preflight &amp; Claim</text>
  <text x="322" y="905" class="step-body">Eligibility + dependency checks</text>
  <text x="322" y="927" class="step-body">Manifest / project validation</text>
  <text x="322" y="949" class="step-body">Claim lease + execution identity</text>
  <text x="322" y="982" class="small">Conservative stop / HITL on uncertainty</text>

  <rect x="556" y="835" width="238" height="176" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1.7"/>
  <circle cx="583" cy="864" r="14" fill="#2563eb"/><text x="583" y="868" text-anchor="middle" class="step-num">03</text>
  <text x="606" y="869" class="step-title">Implementation</text>
  <text x="576" y="905" class="step-body">Workflow template + PlanExecutor</text>
  <text x="576" y="927" class="step-body">Agent in isolated worktree / sandbox</text>
  <text x="576" y="949" class="step-body">Branch push → verification</text>
  <text x="576" y="982" class="small">afk run is implementation-stage only</text>

  <rect x="810" y="835" width="238" height="176" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="837" cy="864" r="14" fill="#d97706"/><text x="837" y="868" text-anchor="middle" class="step-num">04</text>
  <text x="860" y="869" class="step-title">Independent QA</text>
  <text x="830" y="905" class="step-body">Separate QARunner</text>
  <text x="830" y="927" class="step-body">Acceptance checks + test evidence</text>
  <text x="830" y="949" class="step-body">Bounded rework or blocked / HITL</text>
  <text x="830" y="982" class="small">executeWorkItem manages implement + QA</text>

  <rect x="1064" y="835" width="238" height="176" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="1091" cy="864" r="14" fill="#0891b2"/><text x="1091" y="868" text-anchor="middle" class="step-num">05</text>
  <text x="1114" y="869" class="step-title">Change Request</text>
  <text x="1084" y="905" class="step-body">Create / verify PR or MR</text>
  <text x="1084" y="927" class="step-body">Check work-item association</text>
  <text x="1084" y="949" class="step-body">Publish merge-ready evidence</text>
  <text x="1084" y="982" class="small">ChangeProvider</text>

  <rect x="1318" y="835" width="238" height="176" rx="13" fill="#ffffff" stroke="#86b99b" stroke-width="1.7"/>
  <circle cx="1345" cy="864" r="14" fill="#0f766e"/><text x="1345" y="868" text-anchor="middle" class="step-num">06</text>
  <text x="1368" y="869" class="step-title">Human Merge Gate</text>
  <text x="1338" y="905" class="step-body">merge_ready + HITL</text>
  <text x="1338" y="927" class="step-body">Operator reviews and merges</text>
  <text x="1338" y="949" class="step-body">Verified merge → done</text>
  <text x="1338" y="982" class="small">No autonomous final merge</text>

  <path d="M286 923 H302" class="blue-line"/>
  <path d="M540 923 H556" class="blue-line"/>
  <path d="M794 923 H810" class="blue-line"/>
  <path d="M1048 923 H1064" class="blue-line"/>
  <path d="M1302 923 H1318" class="blue-line"/>

  <!-- Data and observability -->
  <text x="58" y="1060" class="section">AUTHORITY, EVIDENCE &amp; OBSERVATION</text>
  <rect x="58" y="1080" width="720" height="145" rx="14" fill="#ffffff" stroke="#d7e0ec" stroke-width="1.5"/>
  <text x="82" y="1114" class="card-title">System of Record &amp; Local Evidence</text>
  <text x="82" y="1142" class="body">Provider backlog = authoritative business state · Git host = branch / merge facts</text>
  <text x="82" y="1167" class="body">~/.afk = config, inventory, runtime and budget · workspace = manifest and execution journal</text>
  <text x="82" y="1192" class="body">Append-only JSONL events and diagnostics explain each execution attempt</text>

  <rect x="822" y="1080" width="720" height="145" rx="14" fill="#ffffff" stroke="#d7e0ec" stroke-width="1.5"/>
  <text x="846" y="1114" class="card-title">Read Models &amp; Operator Visibility</text>
  <text x="846" y="1142" class="body">afk observe · CLI/TUI run views · Desktop Run Center / execution timeline</text>
  <text x="846" y="1167" class="body">Read-only projections over Provider state, audit events and runtime diagnostics</text>
  <text x="846" y="1192" class="small">A process exit code or agent self-report alone never proves completion</text>

  <rect x="58" y="1244" width="1484" height="50" rx="10" fill="#e8eef7"/>
  <text x="80" y="1275" font-size="12.5" font-weight="700" fill="#334155">BOUNDARIES</text>
  <text x="190" y="1275" font-size="12.5" fill="#475569">afk loop is scoped to one manifest-bound work item</text>
  <text x="770" y="1275" font-size="12.5" fill="#475569">Desktop executes shared Runtime through a detached Worker, not an AFK CLI subprocess</text>
</svg>