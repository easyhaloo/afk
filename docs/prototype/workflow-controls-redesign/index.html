<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Buttons & Status Labels Prototype</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef0ec; color: #30342f; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(1640px, 100%); margin: 0 auto; padding: 24px; }
    img { display: block; width: 100%; height: auto; border: 1px solid #dfe2dc; border-radius: 14px; background: #fff; box-shadow: 0 16px 45px rgba(42, 48, 40, .12); }
    p { margin: 14px 4px 0; color: #737a73; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <img src="workflow-controls-redesign.svg" alt="工作流按钮与状态标签原型" />
    <p>保留现有白色工作台、橙色导航、低饱和蓝绿节点、细边框与低阴影，仅优化按钮层级、卡片状态和节点状态表达。</p>
  </main>

</html>
